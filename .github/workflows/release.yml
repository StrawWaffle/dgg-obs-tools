name: Release

# Push a tag such as v0.2.0 to publish a release. Running copies find it within
# a few hours and install it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: go vet ./... && go test ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file scripts/release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
