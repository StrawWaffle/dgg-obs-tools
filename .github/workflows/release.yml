name: Release

# Push a tag such as v0.2.0 to publish a release. Running copies find it within
# a few hours and install it.
#
# The release is published as soon as the Windows and Linux files are built.
# The Mac files are added to it afterwards (macos.yml), because GitHub's Mac
# machines can keep a build queued and nobody else should wait for them. Until
# they arrive, Mac copies simply see no newer release for their system.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build
        with:
          targets: windows/amd64 windows/arm64 linux/amd64 linux/arm64
      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: dist
      - run: cd dist && sha256sum -- * > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file scripts/release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      tag: ${{ github.ref_name }}
